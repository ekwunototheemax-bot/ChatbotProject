<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;
        margin-top: 0px;
        margin-bottom: 0px;
      }


      .send-button{
         background-color: green;
         color: white;
         font-size: 15px;
         padding: 12px 20px;
         border-radius: 10px;
         cursor: pointer;
         margin-left: 10px;
         border: none;

      }
      .chat-input{
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 15px;
        border-width: 1px;

        flex-grow: 1;
      }
      
      .chat-input-container{
        display: flex;
        margin-bottom: 60px;
      }
      .app-container{
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .chat-message-user{
        display: flex;
        justify-content: end;
        align-items: start;

      }
      .chat-message-robot{
        display: flex;
        align-items: start;    

      }
      .chat-message-text{
        background-color: gainsboro;
        border-radius: 10px;
        padding: 12px 15px;
        margin-right: 15px;
        margin-left: 15px;
        margin-bottom: 10px;
        max-width: 300px;

      }
      .chat-message-profile{
        width: 45px;

      }
      .chat-message-container{
        flex-grow: 1;
        margin-top: 10px;
        overflow: scroll;
        scrollbar-width: none;
      }
      .loading-spinner{
        height: 40px;
        margin: -15px;

      }



    </style>
  </head>
  <body>
    <div class="js-container"></div>

    

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/dayjs.js"></script>
    <script type="text/babel">
      function ChatInput({ chatMessages, setChatMessages }) {
        const [textInput, setTextInput] = React.useState('');
        const [isLoading, setIsLoading]= React.useState(false)

        function saveInputText(event) {
          setTextInput(event.target.value); // Fixed casing
        }

        async function sendMessage() {
          if(isLoading || textInput === ''){
            return;
          }
          setIsLoading(true)

          const newChatMessages = [
            ...chatMessages,
            {
              message: textInput,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ];

            setChatMessages([
            ...newChatMessages,
            // This creates a temporary Loading... message.
            // Because we don't save this message in newChatMessages,
            // it will be remove later, when we add the response.
            {
              message: <img src='loading-spinner.gif' className='loading-spinner' />,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);
          const response = await Chatbot.getResponseAsync(textInput);
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

          // Set isLoading to false after everything is done.
          setIsLoading(false);
        }
        function enterKeyDown(event){
          if(event.key === 'Enter'){
            sendMessage()
          } else if(event.key === 'Escape'){
            setTextInput('')
          }
        }

        return (
          <>
            <div className="chat-input-container">
              <input 
                onKeyDown={enterKeyDown}
                placeholder="Send Message to ChatBot" 
                size="30" 
                value={textInput}
                onChange={saveInputText}
                className="chat-input"
              />
              <button
              className ="send-button" 
              onClick={sendMessage}>Send</button>
            
            </div>
          </>
        );
      }

      function ChatMessage({ message, sender }) {
  return (
    <div
      className={
        sender === "user" 
        ? "chat-message-user" 
        : "chat-message-robot"
      }
    >
      {sender === "robot" && (
        <img src="robot.png" className="chat-message-profile" />
      )}

      <div className="chat-message-text">
        {message}
      </div>

      {sender === "user" && (
        <img src="user.png" className="chat-message-profile"/>
      )}
    </div>
  );
}

      function ChatMessages({ chatMessages }) {
        const chatMessagesRef = React.useRef(null)

        React.useEffect(() => {
          const containerElem = chatMessagesRef.current
          if(containerElem){
            containerElem.scrollTop = containerElem.scrollHeight;
          }

        }, [chatMessages])



        return (
          <>
            <div className="chat-message-container"
              ref={chatMessagesRef}>
              {chatMessages.map((chatMessage) => {
                return (
                  <ChatMessage
                    key={chatMessage.id}
                    message={chatMessage.message}
                    sender={chatMessage.sender} 
                  />
                );
              })}
              
            </div>  
          </>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([]);
          
        return (
          <>
            <div className="app-container">

              {chatMessages.length === 0 && (
              <p className="welcome-message">
                Welcome to the chatbot project! Send a message using the textbox below.
              </p>
            )}
              <ChatMessages
                chatMessages={chatMessages}
              />   
              <ChatInput 
                chatMessages={chatMessages}
                setChatMessages={setChatMessages}
              />
            </div>
          </>
        );
      }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>

    <script src="reactBasics.js"></script>

  </body>
</html>
